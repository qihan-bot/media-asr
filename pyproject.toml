[project]
name = "media-asr"
version = "0.0.2"
description = "Local-first speech-to-text for videos and podcasts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "media-asr contributors" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "faster-whisper>=1.2",
  "yt-dlp>=2025.1",
  "httpx>=0.27",
  "feedparser>=6.0",
  "zhconv>=1.4",
  "paramiko>=3.0",
]

[project.optional-dependencies]
# Podcast library term correction (media-asr correct-terms).
library = ["wordfreq", "jieba", "pypinyin"]

[project.urls]
Homepage = "https://github.com/qihan-bot/media-asr"
Source = "https://github.com/qihan-bot/media-asr"

[project.scripts]
media-asr = "media_asr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
