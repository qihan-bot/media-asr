# Shows of a podcast library, read by `media-asr library-update` and `media-asr enrich`.
# Copy to $MEDIA_ASR_DATA/library.toml.
#
# One [[show]] table per subscribed feed:
#   feed      RSS feed URL, as subscribed with `media-asr add <feed> --latest N`;
#             an episode belongs to the show when its feed URL contains this text
#   language  "zh" or "en": Whisper language and punctuation prompt
#   name      optional, for logs
#   hosts     optional: recurring hosts who rarely say their own names on air,
#             given to the speaker-naming prompt as context

