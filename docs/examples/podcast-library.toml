# Shows of a podcast library, read by `media-asr library-update` and `media-asr enrich`.
# Copy to $MEDIA_ASR_DATA/library.toml.
#
# One [[show]] table per subscribed feed:
#   feed      RSS feed URL, as subscribed with `media-asr add <feed> --latest N`;
#             an episode belongs to the show when its feed URL contains this text
#   language  "zh" or "en": Whisper language and punctuation prompt
#   name      optional: for logs, and the show's name on the site that publishes its notes
#   hosts     optional: recurring hosts who rarely say their own names on air,
#             given to the speaker-naming prompt as context
#   voiceprints  optional: reference voices (.npz, relative to the data directory);
#             `media-asr voiceprint` names the speakers whose voice matches one
#
# Site metadata (optional; media-asr only checks it). qihan.ai reads its show list from
# this file, so a show with a slug joins its daily podcast notes:
#   slug      the show's id on the site: lowercase letters, digits, hyphens; unique
#   short     short name for lists and badges (default: name)
#   youtube_channel  channel whose uploads the site matches episodes against (video player)

